[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniuq"
version = "0.2.0"
description = "State-of-the-art uncertainty quantification methods for large language models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Mina Gabriel" }
]

keywords = [
  "llm",
  "language-models",
  "uncertainty",
  "uncertainty-quantification",
  "hallucination-detection",
  "transformers",
  "huggingface"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "torch>=2.0",
  "transformers>=4.40",
  "accelerate>=0.28",
  "sentence-transformers>=2.7",
  "scikit-learn>=1.3",
  "datasets>=2.18",
  "numpy>=1.24",
  "tqdm>=4.65",
  "openai>=1.30"
]

[project.optional-dependencies]
quantize = ["bitsandbytes>=0.43"]
dev = ["pytest>=8.0", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/MinaGabriel/omniuq"
Repository = "https://github.com/MinaGabriel/omniuq"
Issues = "https://github.com/MinaGabriel/omniuq/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "slow: tests that require a GPU and load real models"
]